<div class="card border-0 bg-light h-100">
  
  <!-- Header -->
  <div class="card-header border-0">
    <h5 class="card-title mb-0">
      <a href="{% url 'election_detail' election.uuid %}" class="text-decoration-none link-dark">
        {{ election.name }}
      </a>
    </h5>
  </div>

  <!-- Body -->
  <div class="card-body">
    <p class="mb-1">
      <strong>Start:</strong> {{ election.start_date|date:"M d, Y H:i" }}
    </p>
    <p class="mb-2">
      <strong>End:</strong> {{ election.end_date|date:"M d, Y H:i" }}
    </p>

    <!-- Status -->
    {% with status=election.get_status %}
      <span class="badge bg-secondary">
        {{ status }}
      </span>
    {% endwith %}
  </div>

  <!-- Footer -->
  <div class="card-footer border-0 d-flex justify-content-between">

    <a href="{% url 'election_detail' election.uuid %}" class="btn btn-sm btn-primary">
      View
    </a>

    {% if request.user.is_authenticated %}
      <a href="{% url 'vote' election.uuid %}" class="btn btn-sm btn-success">
        Vote
      </a>
    {% endif %}

  </div>
</div>
